    <script>
      // set the saved look before the page is drawn (no white flash in dark mode)
      try {
        var t = localStorage.getItem('academia_os_theme_v1');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
